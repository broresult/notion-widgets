<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Day</title>
  <style>
    :root { --bg: #ffffff; --bar: #f1f1ef; --ink: #37352f; --muted: #787774; --hi: #37352f; --hi-ink: #ffffff; }
    :root[data-theme='dark'] { --bg: #191919; --bar: #252525; --ink: #e6e6e3; --muted: #9b9a97; --hi: #e6e6e3; --hi-ink: #191919; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme='light']) { --bg: #191919; --bar: #252525; --ink: #e6e6e3; --muted: #9b9a97; --hi: #e6e6e3; --hi-ink: #191919; }
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      display: flex;
      align-items: center;
      overflow: hidden;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .day {
      width: 100%;
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 5px 10px;
      border-radius: 4px;
      background: var(--bar);
      color: var(--ink);
      white-space: nowrap;
    }
    .name { font-size: 15px; font-weight: 700; }
    .date { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .day.today { background: var(--hi); color: var(--hi-ink); }
    .day.today .date { color: inherit; opacity: .75; }
  </style>
</head>
<body>
  <div class="day" id="day"><span class="name">--</span><span class="date"></span></div>
  <script type="module">
    import { mountDay, parseDay } from './week.js';
    import { parseOptions } from '../clock/clock.js';
    mountDay(document.getElementById('day'), parseDay(location.search), parseOptions(location.search).theme);
  </script>
</body>
</html>
