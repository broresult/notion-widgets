<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Day</title>
  <style>
    /* Soft tints of Notion's block colours, one per weekday. Today gets a deeper tint and a side mark. */
    :root { --bg: #ffffff; }
    :root[data-theme='dark'] { --bg: #191919; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #191919; } }
    [data-d='1'] { --bar: #fdf6f9; --ink: #c4789f; --today: #f9e6ef; }
    [data-d='2'] { --bar: #fef6ee; --ink: #cc8a52; --today: #fae6d2; }
    [data-d='3'] { --bar: #fefaec; --ink: #bf9c4c; --today: #f8eecb; }
    [data-d='4'] { --bar: #f4f8f3; --ink: #6e9a7b; --today: #e1ede0; }
    [data-d='5'] { --bar: #f2f8fb; --ink: #5d94b4; --today: #dcecf4; }
    [data-d='6'] { --bar: #f9f7fb; --ink: #9f83ba; --today: #ece4f3; }
    [data-d='7'] { --bar: #fdf4f4; --ink: #cc7c77; --today: #f8e0df; }
    :root[data-theme='dark'] [data-d='1'] { --bar: #2a2226; --ink: #d07fa6; --today: #3a2a32; }
    :root[data-theme='dark'] [data-d='2'] { --bar: #2c2520; --ink: #cf9361; --today: #3d3026; }
    :root[data-theme='dark'] [data-d='3'] { --bar: #2c2820; --ink: #c9a75a; --today: #3c3524; }
    :root[data-theme='dark'] [data-d='4'] { --bar: #222824; --ink: #78a585; --today: #2c3a30; }
    :root[data-theme='dark'] [data-d='5'] { --bar: #1f262a; --ink: #6ea2c4; --today: #283a44; }
    :root[data-theme='dark'] [data-d='6'] { --bar: #27232c; --ink: #a88cc4; --today: #352d3e; }
    :root[data-theme='dark'] [data-d='7'] { --bar: #2c2222; --ink: #d0857f; --today: #3e2c2b; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme='light']) [data-d='1'] { --bar: #2a2226; --ink: #d07fa6; --today: #3a2a32; }
      :root:not([data-theme='light']) [data-d='2'] { --bar: #2c2520; --ink: #cf9361; --today: #3d3026; }
      :root:not([data-theme='light']) [data-d='3'] { --bar: #2c2820; --ink: #c9a75a; --today: #3c3524; }
      :root:not([data-theme='light']) [data-d='4'] { --bar: #222824; --ink: #78a585; --today: #2c3a30; }
      :root:not([data-theme='light']) [data-d='5'] { --bar: #1f262a; --ink: #6ea2c4; --today: #283a44; }
      :root:not([data-theme='light']) [data-d='6'] { --bar: #27232c; --ink: #a88cc4; --today: #352d3e; }
      :root:not([data-theme='light']) [data-d='7'] { --bar: #2c2222; --ink: #d0857f; --today: #3e2c2b; }
    }
    /* ?tone=mauve: one dusty plum family for every day instead of seven colours */
    :root[data-tone='mauve'] .day { --bar: #f8eef3; --ink: #806c79; --today: #f0d9e4; --mark: #4a3f4b; }
    :root[data-theme='dark'][data-tone='mauve'] .day { --bar: #241f25; --ink: #c1a0ac; --today: #3a2f39; --mark: #f0d9e4; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme='light'])[data-tone='mauve'] .day { --bar: #241f25; --ink: #c1a0ac; --today: #3a2f39; --mark: #f0d9e4; }
    }
    /* ?tone=plum: dark plum bars, pink only as the accent (today + the weekly bar text) */
    :root[data-tone='plum'] .day { --bar: #4a3f4b; --ink: #f3e9ee; --today: #16131f; --mark: #f0d9e4; }
    :root[data-tone='plum'] .day[data-d='0'] { --bar: #806c79; }
    :root[data-tone='plum'] .day.today .name { color: #f0d9e4; }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      display: flex;
      align-items: flex-end;  /* sit on the block below; spare frame height goes above */
      padding-bottom: 2px;
      overflow: hidden;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .day {
      width: 100%;
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 5px 10px;
      border-radius: 4px;
      background: var(--bar);
      color: var(--ink);
      white-space: nowrap;
    }
    .name { font-size: 15px; font-weight: 700; }
    .date { font-size: 13px; color: var(--ink); opacity: .7; font-variant-numeric: tabular-nums; }
    .day.today { background: var(--today); box-shadow: inset 3px 0 0 var(--mark, var(--ink)); }
    .day.today .date { opacity: .9; }
  </style>
</head>
<body>
  <div class="day" id="day"><span class="name">--</span><span class="date"></span></div>
  <script type="module">
    import { mountDay, parseDay } from './week.js?v=5';
    import { parseOptions } from '../clock/clock.js?v=5';
    document.getElementById('day').dataset.d = String(parseDay(location.search));
    document.documentElement.dataset.tone = parseOptions(location.search).tone;
    mountDay(document.getElementById('day'), parseDay(location.search), parseOptions(location.search).theme);
  </script>
</body>
</html>
