<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Day</title>
  <style>
    /* Each weekday borrows one of Notion's own block colours, so the bars sit next to Notion blocks naturally. */
    :root { --bg: #ffffff; }
    :root[data-theme='dark'] { --bg: #191919; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #191919; } }
    [data-d='1'] { --bar: #faf1f5; --ink: #c14c8a; }
    [data-d='2'] { --bar: #fbecdd; --ink: #d9730d; }
    [data-d='3'] { --bar: #fbf3db; --ink: #cb912f; }
    [data-d='4'] { --bar: #edf3ec; --ink: #448361; }
    [data-d='5'] { --bar: #e7f3f8; --ink: #337ea9; }
    [data-d='6'] { --bar: #f6f3f9; --ink: #9065b0; }
    [data-d='7'] { --bar: #fdebec; --ink: #d44c47; }
    :root { --on-ink: #ffffff; }
    :root[data-theme='dark'] { --on-ink: #191919; }
    :root[data-theme='dark'] [data-d='1'] { --bar: #2e2328; --ink: #d15796; }
    :root[data-theme='dark'] [data-d='2'] { --bar: #36291f; --ink: #cb7b37; }
    :root[data-theme='dark'] [data-d='3'] { --bar: #372e20; --ink: #c19138; }
    :root[data-theme='dark'] [data-d='4'] { --bar: #242b26; --ink: #4f9768; }
    :root[data-theme='dark'] [data-d='5'] { --bar: #1f282d; --ink: #447acb; }
    :root[data-theme='dark'] [data-d='6'] { --bar: #2a2430; --ink: #865dbb; }
    :root[data-theme='dark'] [data-d='7'] { --bar: #332523; --ink: #be524b; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme='light']) { --on-ink: #191919; }
      :root:not([data-theme='light']) [data-d='1'] { --bar: #2e2328; --ink: #d15796; }
      :root:not([data-theme='light']) [data-d='2'] { --bar: #36291f; --ink: #cb7b37; }
      :root:not([data-theme='light']) [data-d='3'] { --bar: #372e20; --ink: #c19138; }
      :root:not([data-theme='light']) [data-d='4'] { --bar: #242b26; --ink: #4f9768; }
      :root:not([data-theme='light']) [data-d='5'] { --bar: #1f282d; --ink: #447acb; }
      :root:not([data-theme='light']) [data-d='6'] { --bar: #2a2430; --ink: #865dbb; }
      :root:not([data-theme='light']) [data-d='7'] { --bar: #332523; --ink: #be524b; }
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      display: flex;
      align-items: center;
      overflow: hidden;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .day {
      width: 100%;
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 5px 10px;
      border-radius: 4px;
      background: var(--bar);
      color: var(--ink);
      white-space: nowrap;
    }
    .name { font-size: 15px; font-weight: 700; }
    .date { font-size: 13px; color: var(--ink); opacity: .7; font-variant-numeric: tabular-nums; }
    .day.today { background: var(--ink); color: var(--on-ink); }
    .day.today .date { color: inherit; opacity: .8; }
  </style>
</head>
<body>
  <div class="day" id="day"><span class="name">--</span><span class="date"></span></div>
  <script type="module">
    import { mountDay, parseDay } from './week.js';
    import { parseOptions } from '../clock/clock.js';
    mountDay(document.getElementById('day'), parseDay(location.search), parseOptions(location.search).theme);
  </script>
</body>
</html>
